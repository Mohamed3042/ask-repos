name: deploy the UI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "netlify.toml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  netlify:
    name: build and publish to Netlify
    runs-on: ubuntu-latest
    # Nothing is deployed from a fork or from a checkout without the site credentials;
    # the job is skipped with a visible reason rather than failing.
    if: github.repository == 'Mohamed3042/ask-repos'
    environment:
      name: production
      url: https://ask-repos-live.netlify.app
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Are the credentials present?
        id: creds
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID are not set; skipping the deploy."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `netlify deploy --build` runs the build command in a bare checkout; it does not
      # install dependencies the way Netlify's own build servers do. Without this the
      # deploy fails with `sh: 1: next: not found` (it passed locally only because
      # web/node_modules already existed).
      - name: Install the UI's dependencies
        if: steps.creds.outputs.ok == 'true'
        working-directory: web
        run: |
          node scripts/check-lock.mjs
          npm ci --no-audit --no-fund
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes netlify-cli@23 deploy --build --prod

      # A deploy that reports success without the site answering is not a deploy.
      - name: Measure the live URL
        if: steps.creds.outputs.ok == 'true'
        run: |
          set -e
          for page in / /corpus /evals; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://ask-repos-live.netlify.app${page}")
            echo "https://ask-repos-live.netlify.app${page} -> $code"
            [ "$code" = "200" ] || exit 1
          done
