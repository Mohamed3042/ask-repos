name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ASK_REPOS_MODEL_CACHE: ${{ github.workspace }}/.fastembed_cache

jobs:
  quality:
    name: lint + tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: askrepos
          POSTGRES_PASSWORD: askrepos
          POSTGRES_DB: askrepos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askrepos -d askrepos"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://askrepos:askrepos@localhost:5432/askrepos
      # An unreachable database is a failure here, never a silent skip.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache local ONNX models
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5-msmarco-minilm-l6-v2
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  evals:
    name: evals gate (keyless, frozen corpus)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: askrepos
          POSTGRES_PASSWORD: askrepos
          POSTGRES_DB: askrepos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askrepos -d askrepos"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://askrepos:askrepos@localhost:5432/askrepos
      ASK_REPOS_OWNER: Mohamed3042
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache local ONNX models
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5-msmarco-minilm-l6-v2
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Migrate
        run: ask-repos migrate
      - name: Load the frozen corpus (no network)
        run: ask-repos evals load --source evals/corpus
      - name: Run the eval suite and gate
        # Citation validity is an absolute: a single unresolvable citation fails the build.
        # The recall floor is the measured baseline recorded in docs/retrieval.md.
        run: ask-repos evals run --min-citation-validity 1.0 --min-recall5 0.85
      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/

  guard:
    name: which optional jobs can run
    runs-on: ubuntu-latest
    outputs:
      has_gemini: ${{ steps.check.outputs.has_gemini }}
    steps:
      - id: check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "has_gemini=true" >> "$GITHUB_OUTPUT";
          else echo "has_gemini=false" >> "$GITHUB_OUTPUT"; fi

  live:
    name: live Gemini path
    needs: [guard, quality]
    if: needs.guard.outputs.has_gemini == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: askrepos
          POSTGRES_PASSWORD: askrepos
          POSTGRES_DB: askrepos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askrepos -d askrepos"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://askrepos:askrepos@localhost:5432/askrepos
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache local ONNX models
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5-msmarco-minilm-l6-v2
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Migrate and load the frozen corpus
        run: |
          ask-repos migrate
          ask-repos evals load --source evals/corpus
      - name: Evals through the Gemini provider, with the optional judge
        run: >-
          ask-repos evals run --provider gemini --judge
          --min-citation-validity 1.0 --min-recall5 0.85
          --report-dir evals/reports-live
      - name: Upload the live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-live
          path: evals/reports-live/

  image:
    name: build image (publish on main)
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/mohamed3042/ask-repos:${{ github.sha }}
            ghcr.io/mohamed3042/ask-repos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
