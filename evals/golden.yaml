  # -- questions the corpus cannot answer -------------------------------------
  # Each of these was checked against the corpus before being written down. Earlier drafts
  # asked about salary, university and notice period; those were removed because the corpus
  # really does contain them - `flagship-portfolio/public/cv-intake/app.js` is a CV intake
  # form with fields for exactly those things, and answering them from it with a citation
  # was correct behaviour, not a failure. A later draft asked about certifications and hit
  # the same wall: that form has a certifications section, so Gemini answers it (and says
  # the section is empty) while the extractive path refuses. Every question below was
  # checked against BOTH providers on the live service.
  - id: r001
    question: What is the author's monthly rent?
    expect_refusal: true
  - id: r002
    question: Which allergies does the author have?
    expect_refusal: true
  - id: r003
    question: What is the author's blood type?
    expect_refusal: true
  - id: r004
    question: How long is the author's commute to the office?
    expect_refusal: true
  - id: r005
    question: What did the author's last performance review conclude?
    expect_refusal: true
  - id: r006
    question: Which medication regimen does the author follow?
    expect_refusal: true
  - id: r007
    question: Which football team does the author support?
    expect_refusal: true
  - id: r008
    question: Which car does the author drive?
    expect_refusal: true
