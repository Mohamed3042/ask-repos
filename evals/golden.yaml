# Golden set for ask-repos.
#
# Authored by reading the frozen corpus in `evals/corpus/` (16 public repositories of the
# account Mohamed3042, 517 files, 6,018 chunks). Every `must_cite` entry is a file that was
# read and does answer the question; retrieval scores a hit when any of them appears.
#
# The `expect_refusal: true` questions are things a reader might genuinely ask that the
# corpus cannot answer. They are deliberately worded the way a person would word them, not
# tuned to defeat the retriever.
version: 1
corpus: "Mohamed3042 public repositories, snapshot evals/corpus"

questions:
